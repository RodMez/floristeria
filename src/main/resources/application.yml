spring:
  application:
    name: floristeria
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 36000000

imagekit:
  private-key: ${IMAGEKIT_PRIVATE_KEY}
  public-key: ${IMAGEKIT_PUBLIC_KEY}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}

app:
  frontend-url: ${FRONTEND_URL:https://flores.jaiver.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

wompi:
  public-key: ${WOMPI_PUBLIC_KEY:pub_test_XXXXX}
  integrity-secret: ${WOMPI_INTEGRITY_SECRET:test_integrity_XXXXX}
  events-secret: ${WOMPI_EVENTS_SECRET:test_events_XXXXX}

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME}