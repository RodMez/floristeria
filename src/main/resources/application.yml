spring:
  application:
    name: floristeria
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      # VPS 6vCPU/12GB. PG max_connections=60. Pool=25 deja margen para
      # conexiones internas PG (autovacuum, checkpointer) y psql manual.
      # Re-validar con k6 antes de lanzamiento real.
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 20000   # 20s
      idle-timeout: 300000        # 5 min
      max-lifetime: 1200000       # 20 min
      pool-name: FloristeriaHikariPool
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: 36000000

imagekit:
  private-key: ${IMAGEKIT_PRIVATE_KEY}
  public-key: ${IMAGEKIT_PUBLIC_KEY}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}

app:
  frontend-url: ${FRONTEND_URL}
  debug-errors: ${APP_DEBUG_ERRORS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

wompi:
  public-key: ${WOMPI_PUBLIC_KEY:pub_test_XXXXX}
  integrity-secret: ${WOMPI_INTEGRITY_SECRET:test_integrity_XXXXX}
  events-secret: ${WOMPI_EVENTS_SECRET:test_events_XXXXX}

brevo:
  api-key: ${BREVO_API_KEY:placeholder-key}
  sender-email: ${BREVO_SENDER_EMAIL:placeholder@example.com}
  sender-name: ${BREVO_SENDER_NAME:Placeholder}